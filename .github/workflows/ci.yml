name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  # —— 后端：framework install → 编译 + 测试 ——
  backend:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Backend test (聚合构建 · framework submodule + backend)
        run: mvn -B -ntp -f pom.xml verify

  # —— 前端：自动装配 → 依赖 → 类型检查 ——
  frontend:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # 不用 cache: pnpm —— self-hosted runner 缓存上传目标 Azure Blob 本地网络/代理不通，会 0 MB/s 挂死；
          # runner 本地已有全局 pnpm store，install 速度快（与四端仓一致）
      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@9.12.0 --activate
      - name: 生成四端注入 (prepare.mjs)
        run: node scripts/prepare.mjs
      - name: 安装依赖（根 workspace + 各端独立 workspace）
        run: |
          pnpm install --no-frozen-lockfile --force
          for app in admin desktop mobile mini-program; do
            if [ -f "apps/$app/pnpm-workspace.yaml" ]; then
              (cd "apps/$app" && pnpm install --no-frozen-lockfile --force)
            fi
          done
      - name: typecheck
        run: |
          (cd apps/admin && pnpm typecheck)
          (cd apps/desktop && pnpm typecheck)
          (cd apps/mini-program && pnpm typecheck)

  # —— 组合发布（tag v* 触发）：全栈单体 + 四端产物 → Release 资产 ——
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # 不用 cache: pnpm —— 同上（Azure Blob 缓存上传卡死）
      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@9.12.0 --activate
      - name: 安装前端依赖
        run: pnpm install --no-frozen-lockfile --force
      - name: 组合发布 (release.sh · 核心+mini+mobile；desktop 需 Rust/webkit 本地构建)
        run: ./scripts/release.sh --with-mini --with-mobile
      - name: 上传 Release 资产
        uses: softprops/action-gh-release@v2
        with:
          files: dist/lieshouboot-release/**
