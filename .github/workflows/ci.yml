name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  # —— 后端：framework install → 编译 + 测试 ——
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install LieShou-framework (上游同源唯一)
        run: |
          git clone --depth 1 https://github.com/HUNTERCAT-DIGITAL/LieShou-framework.git /tmp/framework
          cd /tmp/framework && mvn -B -ntp -DskipTests install
      - name: Backend test (mvn verify)
        run: cd backend && mvn -B -ntp verify

  # —— 前端：自动装配 → 依赖 → 类型检查 ——
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: corepack enable
      - name: 生成四端注入 (prepare.mjs)
        run: node scripts/prepare.mjs
      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile
      - name: typecheck
        run: |
          (cd apps/admin && pnpm typecheck)
          (cd apps/mini-program && pnpm typecheck)

  # —— 组合发布（tag v* 触发）：全栈单体 + 四端产物 → Release 资产 ——
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: corepack enable
      - name: Install LieShou-framework
        run: |
          git clone --depth 1 https://github.com/HUNTERCAT-DIGITAL/LieShou-framework.git /tmp/framework
          cd /tmp/framework && mvn -B -ntp -DskipTests install
      - name: 安装前端依赖
        run: pnpm install --no-frozen-lockfile
      - name: 组合发布 (release.sh · 核心+mini+mobile；desktop 需 Rust/webkit 本地构建)
        run: ./scripts/release.sh --with-mini --with-mobile
      - name: 上传 Release 资产
        uses: softprops/action-gh-release@v2
        with:
          files: dist/lieshouboot-release/**
