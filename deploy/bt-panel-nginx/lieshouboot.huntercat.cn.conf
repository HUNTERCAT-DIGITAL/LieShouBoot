# ============================================================
# LieShouBoot（猎手云开源单体版）· WEB 入口
#   - 前端: 127.0.0.1:5173 (apps/admin vite dev / 或 nginx 静态)
#   - API : 127.0.0.1:8080 (backend 单体 Spring Boot)
#   - 证书: *.huntercat.cn 通配（含本域 SAN）
#   - 部署机: 入口机（宝塔面板 / nginx）
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name lieshouboot.huntercat.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /data/infra/nginx/data;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lieshouboot.huntercat.cn;

    # Let0027s Encrypt 单域证书（acme.sh 签发，与入口机现有模式一致）
    ssl_certificate     /etc/nginx/ssl/lieshouboot.huntercat.cn_fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/lieshouboot.huntercat.cn.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;

    # === API 反代到 LieShouBoot 单体后端 (8080) ===
    location /api/ {
        proxy_pass http://127.0.0.1:${BOOT_API_TUNNEL:-8080}; # 经 frp 隧道指向开发机后端
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_pass_header  Set-Cookie;
        proxy_cookie_path  / /;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # === WEB 入口: admin-web 前端 (5173) ===
    location / {
        proxy_pass http://127.0.0.1:${BOOT_WEB_TUNNEL:-5173}; # 经 frp 隧道指向开发机 admin-web
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket / HMR 必须
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    access_log /data/infra/nginx/logs/lieshouboot.huntercat.cn.access.log;
    error_log  /data/infra/nginx/logs/lieshouboot.huntercat.cn.error.log;
}
