# ============================================================
# lieshou-boot.huntercat.cn · 猎手云开源单体版（WXF-DEV 开发机）
#   全栈单体: 单 jar(43115) serve API + 内嵌前端(admin-web build)
#   隧道: frp boot → 开发机 127.0.0.1:43115（frpc.toml: boot proxy）
#   证书: acme.sh 签发(ECC) · 自动续期 --reloadcmd "nginx -s reload"
#   部署机: 入口机（lsc-edge-1 · 47.96.122.117 · /etc/nginx/conf.d/）
# ============================================================
server {
    listen 80;
    server_name lieshou-boot.huntercat.cn;

    location /.well-known/acme-challenge/ {
        root /www/wwwroot/lsmWebsite;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name lieshou-boot.huntercat.cn;

    ssl_certificate     /etc/nginx/ssl/lieshou-boot.huntercat.cn_fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/lieshou-boot.huntercat.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL_BOOT:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;

    # 全栈单体: API + 内嵌前端同源 43115
    location / {
        proxy_pass http://127.0.0.1:43115;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_pass_header  Set-Cookie;
        proxy_cookie_path  / /;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    access_log /var/log/nginx/lieshou-boot.huntercat.cn.access.log;
    error_log  /var/log/nginx/lieshou-boot.huntercat.cn.error.log;
}
